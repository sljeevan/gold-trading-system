# Nginx Reverse Proxy Configuration for Atlas Trading Dashboard
# Production Architecture:
# - Streamlit Dashboard UI: http://127.0.0.1:5000
# - FastAPI Analytics & Health API: http://127.0.0.1:8787
# Replace 'trade.flss.in' with your actual server domain.

server {
    listen 80;
    listen [::]:80;
    server_name trade.flss.in;

    # Redirect all HTTP traffic to HTTPS in production
    # return 301 https://$host$request_uri;

    # Streamlit UI Reverse Proxy (Port 5000)
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # FastAPI Backend Reverse Proxy (Port 8787)
    location /api/ {
        proxy_pass http://127.0.0.1:8787/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

