[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gold-trading-system"
version = "0.1.0"
description = "Institutional Quantitative Trading System (Spot Gold XAU/USD, Bitcoin BTC/USD, Ethereum ETH/USD) with Multi-Timeframe Signals, Multi-Agent Confluence, and XM Broker MT5 Integration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    "yfinance>=0.2.35",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.3.0",
    "lightgbm>=4.0.0",
    "joblib>=1.3.0",
    "scipy>=1.11.0",
]
dashboard = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "streamlit>=1.30.0",
    "plotly>=5.15.0",
]
research = [
    "openbb>=5.0.0",
    "openbb-core>=2.0.0",
    "openbb-federal-reserve>=2.0.0",
    "openbb-fred>=2.0.0",
    "openbb-deribit>=2.0.0",
    "openbb-cftc>=2.0.0",
]
mt5 = [
    "MetaTrader5>=5.0.45; platform_system == 'Windows'",
]
metaapi = [
    "metaapi-cloud-sdk>=25.0.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-mock>=3.12.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
]
all = [
    "scikit-learn>=1.3.0",
    "lightgbm>=4.0.0",
    "joblib>=1.3.0",
    "scipy>=1.11.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "streamlit>=1.30.0",
    "plotly>=5.15.0",
    "openbb>=5.0.0",
    "openbb-core>=2.0.0",
    "openbb-federal-reserve>=2.0.0",
    "openbb-fred>=2.0.0",
    "openbb-deribit>=2.0.0",
    "openbb-cftc>=2.0.0",
    "pytest>=7.4.0",
    "pytest-mock>=3.12.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
gold-mcp = "gold_trader.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gold_trader"]

[tool.pytest.ini_options]
addopts = "-p no:typeguard"
pythonpath = ["src"]
testpaths = ["tests"]
